plugins {
    id 'java'
}

group = 'multiurlcopy'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

// Burp holds an open reference to whatever jar it loaded, and
// `gradlew clean` deletes build/. `install` keeps a stable copy outside
// build/ so Burp can be pointed at a path that survives a clean.
tasks.register('install', Copy) {
    from tasks.named('jar')
    into "$projectDir/dist"
}

jar {
    archiveBaseName = 'multi-url-copy'
    // No version in the filename: Burp is pointed at a path, and the BApp
    // Store's EntryPoint is a fixed string. A moving filename would break
    // both on every release.
    archiveVersion = ''
    manifest {
        // The ServiceLoader file under META-INF/services is what Montoya
        // actually reads; this attribute is a harmless second declaration
        // so the jar still names its entry point if the resource is lost.
        attributes 'Extension-ClassName': 'multiurlcopy.burp.MultiUrlCopyExtension'
    }
}
